name: integration tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  # pyexasol 3 reports usage on connect; CI never does.
  EXASOL_TELEMETRY_DISABLE: "true"

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest exasol-semantic-views release the package supports, and the newest.
        esv-ref: ["v0.6.1", "main"]
    env:
      EXASOL_HOST: 127.0.0.1
      EXASOL_PORT: "8563"
      EXASOL_USER: sys
      EXASOL_PASSWORD: exasol
      EXASOL_DSN: 127.0.0.1:8563
      DBT_ENV_SECRET_EXASOL_PASSWORD: exasol
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out exasol-semantic-views ${{ matrix.esv-ref }}
        uses: actions/checkout@v7
        with:
          repository: exasol-labs/exasol-semantic-views
          ref: ${{ matrix.esv-ref }}
          path: esv
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r esv/tools/requirements-osi.txt "dbt-exasol>=1.10"
          sudo apt-get update
          sudo apt-get install -y lua5.4
      # The same database exasol-semantic-views tests against. Started here
      # rather than as a service so there is room for it first: it needs a few
      # GB for its data volume and refuses to boot without ("insufficient
      # space"), and it needs shared memory beyond Docker's 64 MB default.
      - name: Start Exasol
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          docker run -d --name exasol --privileged --shm-size=2gb -p 8563:8563 \
            exasol/docker-db:latest-2026.1
      - name: Wait for Exasol
        run: python esv/tools/dev/wait_for_exasol.py || { docker logs exasol | tail -40; exit 1; }
      - name: Install exasol-semantic-views
        run: python esv/tools/install.py
      - name: dbt build
        working-directory: integration_tests
        env:
          DBT_PROFILES_DIR: .
          ESV_IT_SCHEMA: ESV_DBT_IT_${{ github.run_number }}
        run: |
          dbt deps
          dbt build
