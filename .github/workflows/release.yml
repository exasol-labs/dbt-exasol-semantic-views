name: release

# Pushing a tag X.Y.Z runs the integration tests and publishes a GitHub release
# with that version's CHANGELOG entry. dbt Hub reads the tag itself; the
# release is for people reading the repository.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag matches dbt_project.yml and CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          grep -qx "version: '${TAG}'" dbt_project.yml \
            || { echo "dbt_project.yml version is not ${TAG}"; exit 1; }
          grep -qE "^## ${TAG//./\\.} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            || { echo "CHANGELOG.md has no dated '## ${TAG} - YYYY-MM-DD' entry"; exit 1; }

  tests:
    needs: check-version
    uses: ./.github/workflows/ci.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v head="## ${TAG} - " '
            index($0, head) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "${TAG}" --verify-tag \
            --title "exasol_semantic_views ${TAG}" --notes-file notes.md
