version: 2

macros:
  - name: adopt
    description: >
      The post-hook that makes a view model a semantic view. Renders
      `EXECUTE SCRIPT SEMANTIC_ADMIN.ADOPT_VIEW('<esv_model>', '<this.schema>',
      '<this.identifier>')`, after checking that the database has
      exasol-semantic-views 0.7.1 or later. The view must be an aggregate over
      one table; ADOPT_VIEW creates the model when absent, validates and
      publishes it, and raises on any refusal, failing the node. Dispatched.
    arguments:
      - name: esv_model
        type: string
        description: ESV model to adopt the view into; created when it does not exist.

  - name: query
    description: >
      Compiles a structured request with COMPILE_REQUEST_JSON at run time and
      returns the governed SQL, with each requested field as an upper-case
      column. Put a `-- depends_on:` comment with a ref() to the adopted view
      model in the calling model, so it runs after the view is adopted.
    arguments:
      - name: model
        type: string
        description: ESV model name.
      - name: object
        type: string
        description: Semantic object (view) name -- an adopted view's name, upper-cased.
      - name: metrics
        type: list[string]
        description: Metrics to select.
      - name: dimensions
        type: list[string]
        description: Dimensions to group by.
      - name: filters
        type: list[dict[str, any]]
        description: "Filter items, e.g. `{'field': 'order_status', 'op': '=', 'value': 'COMPLETE'}`."
      - name: having
        type: list[dict[str, any]]
        description: Metric predicates, in the filter item shape.
      - name: order_by
        type: list[dict[str, any]]
        description: "Order items, e.g. `{'field': 'total_revenue', 'direction': 'desc'}`."
      - name: limit
        type: optional[integer]
        description: Row limit.

  - name: compile_sql
    description: >
      Compiles a Semantic SQL statement with COMPILE_SQL at run time and returns
      the governed SQL. Column names are as the statement selects them.
    arguments:
      - name: semantic_sql
        type: string
        description: A Semantic SQL SELECT over a published semantic object.
